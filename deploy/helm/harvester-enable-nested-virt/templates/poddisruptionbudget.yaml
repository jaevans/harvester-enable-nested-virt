{{- /* A PDB with minAvailable 1 on a single replica blocks node drains forever, so only render it when there is more than one replica. */ -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "enable-nested-virt.fullname" . }}
  labels:
    {{- include "enable-nested-virt.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "enable-nested-virt.selectorLabels" . | nindent 6 }}
{{- end }}
